<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Дача Сердюка — магазин</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root { color-scheme: light dark; --bg: var(--tg-theme-bg-color,#fff); --text: var(--tg-theme-text-color,#111); --muted: var(--tg-theme-hint-color,#777); --card: var(--tg-theme-secondary-bg-color,#f2f2f2); --button: var(--tg-theme-button-color,#2481cc); --button-text: var(--tg-theme-button-text-color,#fff); }
    * { box-sizing: border-box; } body { margin:0; background:var(--bg); color:var(--text); font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    main { max-width:560px; margin:auto; padding:20px 16px 100px; } h1 { margin:0 0 6px; font-size:27px; } h2 { font-size:21px; margin:0 0 14px; } p { line-height:1.45; } .muted { color:var(--muted); }
    .top { text-align:center; margin:8px 0 24px; } .grid { display:grid; gap:10px; } button { border:0; border-radius:14px; padding:14px; font:inherit; color:var(--text); background:var(--card); text-align:left; cursor:pointer; } .primary { width:100%; color:var(--button-text); background:var(--button); text-align:center; font-weight:600; } .row { display:flex; align-items:center; justify-content:space-between; gap:12px; } .price { color:var(--button); font-weight:700; white-space:nowrap; } .back { padding:5px 0 14px; background:transparent; color:var(--button); } .product { padding:16px; } .product h3 { margin:0 0 8px; } .product button { margin-top:12px; text-align:center; width:100%; } .qty { display:flex; align-items:center; gap:12px; margin-top:12px; } .qty button { width:42px; padding:8px; text-align:center; } .empty { text-align:center; padding:28px 8px; }
  </style>
</head>
<body><main id="app"><p class="empty">Загружаем каталог…</p></main>
<script>
(() => {
  const tg = window.Telegram && window.Telegram.WebApp;
  const app = document.getElementById('app'); let catalog = []; let cart = {}; let view = 'home'; let category = null;
  const rub = n => Number(n).toFixed(0) + ' ₽'; const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const count = () => Object.values(cart).reduce((a,b) => a+b, 0); const total = () => Object.entries(cart).reduce((s,[id,q]) => s + (catalog.find(p=>p.id===Number(id))?.price||0)*q, 0);
  function render() {
    if (tg) { tg.ready(); tg.expand(); tg.MainButton.hide(); }
    if (view === 'home') {
      const cats = [...new Map(catalog.map(p => [p.category, {name:p.category, emoji:p.emoji, count:0}])).values()]; cats.forEach(c => c.count = catalog.filter(p=>p.category===c.name).length);
      const catButtons = cats.map(c => '<button class="row" data-cat="' + esc(c.name) + '"><span>' + c.emoji + ' ' + esc(c.name) + '</span><span class="muted">' + c.count + ' →</span></button>').join('');
      const cartLabel = count() ? ' (' + count() + ')' : '';
      app.innerHTML = '<section class="top"><h1>🍷 Дача Сердюка</h1><p class="muted">Вино для дома и добрых встреч.</p></section><div class="grid">' + catButtons + '</div><p><button class="primary" data-cart>🧺 Корзина' + cartLabel + '</button></p>';
    } else if (view === 'category') {
      const products = catalog.filter(p=>p.category===category); const productButtons = products.map(p => '<button class="row" data-product="' + p.id + '"><span>' + esc(p.name) + '</span><span class="price">' + rub(p.price) + '</span></button>').join(''); app.innerHTML = '<button class="back" data-home>← Назад</button><h2>' + esc(category) + '</h2><div class="grid">' + productButtons + '</div>';
    } else if (view === 'product') {
      const p = catalog.find(x=>x.id===Number(category)); const q = cart[p.id]||0; const action = q ? '<div class="qty"><button data-dec="' + p.id + '">−</button><b>В корзине: ' + q + '</b><button data-inc="' + p.id + '">+</button></div>' : '<button class="primary" data-inc="' + p.id + '">➕ В корзину</button>'; app.innerHTML = '<button class="back" data-category="' + esc(p.category) + '">← Назад</button><section class="product"><h2>' + esc(p.name) + '</h2><div class="price">' + rub(p.price) + '</div><p>' + esc(p.description) + '</p>' + action + '</section>';
    } else {
      const lines = Object.entries(cart).map(([id,q])=>{const p=catalog.find(x=>x.id===Number(id)); return '<section class="product"><div class="row"><span>' + esc(p.name) + ' × ' + q + '</span><b class="price">' + rub(p.price*q) + '</b></div><div class="qty"><button data-dec="' + p.id + '">−</button><span>' + q + '</span><button data-inc="' + p.id + '">+</button></div></section>';}).join('');
      const checkout = lines ? '<section class="product"><div class="row"><b>Итого</b><b class="price">' + rub(total()) + '</b></div><button class="primary" data-send>Отправить заявку</button></section>' : '';
      app.innerHTML = '<button class="back" data-home>← Каталог</button><h2>🧺 Корзина</h2>' + (lines || '<p class="empty muted">Корзина пуста. Выберите вино в каталоге.</p>') + checkout;
      if (tg && lines) { tg.MainButton.setText('Отправить заявку — ' + rub(total())); tg.MainButton.show(); tg.MainButton.onClick(send); }
    }
  }
  function send() { if (!count()) return; tg ? (tg.sendData(JSON.stringify({items:Object.entries(cart).map(([id,quantity])=>({id:Number(id),quantity}))})), tg.close()) : alert('Откройте магазин внутри Telegram.'); }
  app.addEventListener('click', e => { const b=e.target.closest('button'); if(!b)return; if(b.dataset.cat){category=b.dataset.cat;view='category';} else if(b.dataset.product){category=b.dataset.product;view='product';} else if(b.dataset.category){category=b.dataset.category;view='category';} else if(b.dataset.home){view='home';} else if(b.dataset.cart){view='cart';} else if(b.dataset.inc){cart[b.dataset.inc]=(cart[b.dataset.inc]||0)+1;} else if(b.dataset.dec){cart[b.dataset.dec]=(cart[b.dataset.dec]||0)-1;if(cart[b.dataset.dec]<=0)delete cart[b.dataset.dec];} else if(b.dataset.send){send();} render(); });
  const fallbackCatalog = [
    {id:1, category:'Красное вино', emoji:'🍷', name:'Красное сухое «Дача»', description:'Насыщенное сухое вино для ужина и дружеских встреч.', price:1290},
    {id:2, category:'Красное вино', emoji:'🍷', name:'Красное полусладкое «Сердюк»', description:'Мягкое ягодное вино с приятным послевкусием.', price:1190},
    {id:3, category:'Белое вино', emoji:'🥂', name:'Белое сухое «Лето»', description:'Легкое освежающее вино к рыбе и овощам.', price:1090},
    {id:4, category:'Розовое вино', emoji:'🌸', name:'Розовое полусухое «Сад»', description:'Ароматное розовое вино для теплого вечера.', price:1250},
    {id:5, category:'Игристое', emoji:'✨', name:'Игристое «Праздник»', description:'Праздничное игристое для особого случая.', price:1490}
  ];
  fetch('./catalog.json').then(r=>r.ok?r.json():Promise.reject()).then(data=>{catalog=data;render();}).catch(()=>{catalog=fallbackCatalog;render();});
})();
</script></body></html>
