<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4efe6">
  <title>Дача Сердюка — вина долины Дона</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      color-scheme: light;
      --cream: #f4efe6;
      --paper: #fbf8f2;
      --ink: #27231f;
      --wine: #5b2028;
      --muted: #83766b;
      --line: #d9cfc1;
      --serif: Georgia, "Times New Roman", serif;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    html { background: var(--cream); }
    body { margin: 0; background: var(--cream); color: var(--ink); font: 15px/1.55 var(--sans); -webkit-font-smoothing: antialiased; }
    button { color: inherit; font: inherit; }
    .shell { width: min(100%, 680px); min-height: 100vh; margin: 0 auto; padding: max(20px, env(safe-area-inset-top)) 22px max(34px, env(safe-area-inset-bottom)); }
    .masthead { display: flex; justify-content: space-between; align-items: center; gap: 14px; padding: 5px 0 17px; border-bottom: 1px solid var(--line); color: var(--wine); font-size: 10px; letter-spacing: 1.8px; text-transform: uppercase; }
    .masthead .place { color: var(--muted); text-align: right; letter-spacing: 1.2px; }
    .hero { padding: 48px 0 37px; border-bottom: 1px solid var(--line); }
    .eyebrow { margin: 0 0 15px; color: var(--wine); font-size: 10px; letter-spacing: 2px; text-transform: uppercase; }
    h1, h2, h3, .wine-name { font-family: var(--serif); font-weight: 400; }
    h1 { max-width: 560px; margin: 0; font-size: clamp(53px, 15vw, 82px); letter-spacing: -4.5px; line-height: .88; }
    .hero-copy { max-width: 430px; margin: 22px 0 0; color: #61574e; font: 19px/1.4 var(--serif); }
    .hero-note { display: flex; align-items: center; gap: 10px; margin-top: 28px; color: var(--muted); font-size: 11px; letter-spacing: .8px; text-transform: uppercase; }
    .hero-note::before { width: 28px; height: 1px; background: var(--wine); content: ""; }
    .section-head { display: flex; justify-content: space-between; align-items: end; gap: 10px; margin: 37px 0 14px; }
    .section-head h2 { margin: 0; font-size: 34px; letter-spacing: -1.2px; line-height: 1; }
    .section-head span { color: var(--muted); font-size: 11px; }
    .category-list { border-top: 1px solid var(--line); }
    .category-row { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 16px 0; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; cursor: pointer; }
    .category-name { font: 25px/1.15 var(--serif); }
    .category-meta { color: var(--muted); font-size: 11px; }
    .category-arrow { margin-left: 7px; color: var(--wine); font-size: 17px; }
    .about-teaser { margin-top: 39px; padding: 25px 0 6px; border-top: 1px solid var(--line); }
    .about-teaser h2 { max-width: 460px; margin: 0; font-size: 36px; line-height: 1.02; letter-spacing: -1.2px; }
    .about-teaser p:not(.eyebrow) { max-width: 500px; margin: 14px 0; color: #61574e; }
    .text-link { padding: 7px 0; border: 0; border-bottom: 1px solid var(--wine); background: transparent; color: var(--wine); font-size: 12px; letter-spacing: .4px; cursor: pointer; }
    .footnote { margin-top: 38px; padding-top: 14px; border-top: 1px solid var(--line); color: var(--muted); font-size: 10px; }
    .back { display: inline-flex; align-items: center; gap: 8px; margin: 10px 0 22px; padding: 8px 0; border: 0; background: none; color: var(--wine); font-size: 13px; cursor: pointer; }
    .view-title { margin: 0 0 10px; font: 42px/.98 var(--serif); letter-spacing: -1.5px; }
    .view-description { margin: 0 0 25px; color: var(--muted); font-size: 13px; }
    .wine-list { border-top: 1px solid var(--line); }
    .wine-row { display: grid; grid-template-columns: 86px minmax(0, 1fr) 20px; align-items: center; gap: 15px; width: 100%; min-height: 130px; padding: 13px 0; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; cursor: pointer; }
    .wine-thumb { width: 86px; height: 104px; object-fit: contain; }
    .wine-card-copy { min-width: 0; }
    .wine-card-copy .eyebrow { margin: 0 0 5px; font-size: 9px; letter-spacing: 1.5px; }
    .wine-name { display: block; font-size: 22px; line-height: 1.05; }
    .wine-blurb { display: -webkit-box; overflow: hidden; margin-top: 7px; color: #73675d; font-size: 11px; line-height: 1.4; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
    .row-arrow { color: var(--wine); }
    .detail-top { display: grid; grid-template-columns: minmax(115px, .72fr) 1fr; align-items: center; gap: 21px; padding: 6px 0 26px; border-bottom: 1px solid var(--line); }
    .detail-image { display: block; width: 100%; height: 265px; object-fit: contain; }
    .detail-heading .eyebrow { margin-bottom: 10px; }
    .detail-heading h1 { font-size: clamp(37px, 10vw, 56px); letter-spacing: -2px; line-height: .96; }
    .detail-heading .grape { margin: 12px 0 0; color: var(--muted); font: 15px/1.4 var(--serif); }
    .detail-note { margin: 14px 0 0; color: #665c52; font-size: 11px; line-height: 1.5; }
    .notes { padding-top: 8px; }
    .note { padding: 16px 0; border-bottom: 1px solid var(--line); }
    .note h2 { margin: 0 0 5px; color: var(--wine); font: 10px var(--sans); letter-spacing: 1.6px; text-transform: uppercase; }
    .note p { margin: 0; font: 16px/1.5 var(--serif); }
    .about-page { padding-top: 23px; }
    .about-page h1 { max-width: 560px; font-size: clamp(48px, 13vw, 72px); }
    .about-lead { margin: 22px 0 29px; color: #5c5047; font: 21px/1.43 var(--serif); }
    .about-section { padding: 20px 0; border-top: 1px solid var(--line); }
    .about-section h2 { margin: 0 0 8px; color: var(--wine); font-size: 23px; }
    .about-section p { margin: 0; color: #5c534a; }
    .facts-list { margin: 12px 0 0; padding: 0; list-style: none; }
    .facts-list li { padding: 7px 0; border-bottom: 1px solid #e2d9cd; }
    .state-message { padding: 36px 0; color: var(--muted); font: 17px var(--serif); }
    @media (max-width: 390px) {
      .shell { padding-right: 17px; padding-left: 17px; }
      .detail-top { grid-template-columns: 112px minmax(0, 1fr); gap: 15px; }
      .detail-image { height: 235px; }
      .wine-row { grid-template-columns: 72px minmax(0, 1fr) 15px; gap: 11px; }
      .wine-thumb { width: 72px; height: 96px; }
    }
  </style>
</head>
<body>
  <main class="shell" id="app" aria-live="polite"><p class="state-message">Открываем винную карту…</p></main>
  <script>
    (() => {
      const tg = window.Telegram && window.Telegram.WebApp;
      const app = document.getElementById('app');
      let wines = [];
      let screen = { name: 'home' };
      const esc = value => String(value ?? '').replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));
      const excerpt = text => {
        const sentence = String(text || '').split(/(?<=[.!?])\s+/)[0];
        return sentence.length > 125 ? sentence.slice(0, 122).trimEnd() + '…' : sentence;
      };
      const categories = () => [...new Set(wines.map(wine => wine.category))];
      const backButton = () => {
        if (!tg || !tg.BackButton) return;
        if (screen.name === 'home') tg.BackButton.hide();
        else tg.BackButton.show();
      };
      function goHome() { screen = { name: 'home' }; render(); }
      function render() {
        if (tg) { tg.ready(); tg.expand(); }
        backButton();
        if (screen.name === 'home') {
          const rows = categories().map(category => {
            const count = wines.filter(wine => wine.category === category).length;
            return `<button class="category-row" data-category="${esc(category)}"><span class="category-name">${esc(category)}</span><span class="category-meta">${count} ${count === 1 ? 'вино' : count < 5 ? 'вина' : 'вин'} <span class="category-arrow">↗</span></span></button>`;
          }).join('');
          app.innerHTML = `<header class="masthead"><span>Дача Сердюка</span><span class="place">Долина Дона · с 2003 года</span></header>
            <section class="hero"><p class="eyebrow">Семейная винодельня</p><h1>Вино<br>с берегов<br>Дона.</h1><p class="hero-copy">Небольшое семейное хозяйство. Виноград, ручной труд и вино без спешки.</p><div class="hero-note">Усть-Донецкий район · хутор Каныгин</div></section>
            <section aria-labelledby="wines-title"><div class="section-head"><h2 id="wines-title">Винная карта</h2><span>${wines.length} вин</span></div><div class="category-list">${rows}</div></section>
            <section class="about-teaser"><p class="eyebrow">О хозяйстве</p><h2>Семейное дело у Дона</h2><p>Выращиваем местные и грузинские сорта и работаем с вином вручную, следуя характеру винограда и места.</p><button class="text-link" data-about>История винодельни <span aria-hidden="true">↗</span></button></section>
            <footer class="footnote">Винная карта и рассказы о хозяйстве «Дача Сердюка»</footer>`;
        } else if (screen.name === 'category') {
          const products = wines.filter(wine => wine.category === screen.category);
          const rows = products.map(wine => `<button class="wine-row" data-wine="${wine.id}"><img class="wine-thumb" src="${esc(wine.image)}" alt="" loading="lazy"><span class="wine-card-copy"><span class="eyebrow">${esc(wine.category)}</span><span class="wine-name">${esc(wine.name)}</span><span class="wine-blurb">${esc(excerpt(wine.aroma + ' ' + wine.taste))}</span></span><span class="row-arrow" aria-hidden="true">↗</span></button>`).join('');
          app.innerHTML = `<header class="masthead"><span>Дача Сердюка</span><span class="place">Винная карта</span></header><button class="back" data-back>← Все категории</button><h1 class="view-title">${esc(screen.category)}</h1><p class="view-description">${products.length} ${products.length === 1 ? 'вино' : products.length < 5 ? 'вина' : 'вин'} из нашей винной карты</p><div class="wine-list">${rows}</div>`;
        } else if (screen.name === 'wine') {
          const wine = wines.find(item => item.id === screen.id);
          if (!wine) { goHome(); return; }
          app.innerHTML = `<header class="masthead"><span>Дача Сердюка</span><span class="place">${esc(wine.category)}</span></header><button class="back" data-back>← ${esc(wine.category)}</button><section class="detail-top"><img class="detail-image" src="${esc(wine.image)}" alt="Бутылка вина «${esc(wine.name)}»"><div class="detail-heading"><p class="eyebrow">${esc(wine.category)}</p><h1>${esc(wine.name)}</h1><p class="grape">${esc(wine.variety)}</p><p class="detail-note">${esc(wine.aging)}</p></div></section><section class="notes"><article class="note"><h2>Ароматика</h2><p>${esc(wine.aroma)}</p></article><article class="note"><h2>Вкус</h2><p>${esc(wine.taste)}</p></article><article class="note"><h2>К столу</h2><p>${esc(wine.pairing)}</p></article></section><footer class="footnote">Описание по материалам винодельни «Дача Сердюка»</footer>`;
        } else if (screen.name === 'about') {
          app.innerHTML = `<header class="masthead"><span>Дача Сердюка</span><span class="place">Долина Дона</span></header><button class="back" data-back>← На главную</button><section class="about-page"><p class="eyebrow">Наша история</p><h1>Семейная винодельня на Дону</h1><p class="about-lead">«Дача Сердюка» основана в 2003 году. Это семейное хозяйство, где отец и три сына вместе занимаются виноградом и вином.</p><article class="about-section"><h2>Место</h2><p>Виноградники находятся в Усть-Донецком районе, у хутора Каныгин. Их заложили в 2014 году. Два с половиной гектара песчаных и глинистых почв.</p><ul class="facts-list"><li>Сибирьковый</li><li>Красностоп Золотовский</li><li>Саперави</li><li>Каберне Совиньон</li><li>Ркацители</li></ul></article><article class="about-section"><h2>Работа в погребе</h2><p>Семейное производство, ручной труд и спонтанное брожение на диких дрожжах для красных и оранжевых вин. Вина не осветляют и не фильтруют; в презентации винодельни также заявлено, что консерванты, включая диоксид серы, не добавляются.</p></article><article class="about-section"><h2>Забота о степи</h2><p>По материалам презентации, 10 рублей с каждой бутылки направляются в проект «Живая природа степи».</p></article></section><footer class="footnote">Факты и описание — из презентации винодельни «Дача Сердюка».</footer>`;
        }
      }
      app.addEventListener('click', event => {
        const button = event.target.closest('button');
        if (!button) return;
        if (button.dataset.category) screen = { name: 'category', category: button.dataset.category };
        else if (button.dataset.wine) screen = { name: 'wine', id: Number(button.dataset.wine) };
        else if (button.hasAttribute('data-about')) screen = { name: 'about' };
        else if (button.hasAttribute('data-back')) {
          if (screen.name === 'wine') screen = { name: 'category', category: wines.find(wine => wine.id === screen.id)?.category || '' };
          else goHome();
        }
        render();
      });
      if (tg && tg.BackButton) tg.BackButton.onClick(() => {
        if (screen.name === 'wine') screen = { name: 'category', category: wines.find(wine => wine.id === screen.id)?.category || '' };
        else goHome();
        render();
      });
      fetch('./catalog.json').then(response => {
        if (!response.ok) throw new Error('catalog unavailable');
        return response.json();
      }).then(data => {
        if (!Array.isArray(data) || !data.length) throw new Error('catalog empty');
        wines = data;
        render();
      }).catch(() => {
        app.innerHTML = '<p class="state-message">Не удалось загрузить винную карту. Проверьте подключение и откройте страницу ещё раз.</p>';
      });
    })();
  </script>
</body>
</html>
